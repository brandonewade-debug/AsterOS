name: iOS build and tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          devices = [d for runtime, items in data['devices'].items() if 'iOS' in runtime for d in items if d['name'].startswith('iPhone')]
          if not devices:
              raise SystemExit('No iPhone simulator is installed')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + devices[0]['udid'] + '\n')
          PY
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test -project AsterOS.xcodeproj -scheme AsterOS -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterOS-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
